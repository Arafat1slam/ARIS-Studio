name: ARIS 24/7 Cloud Auto-Pilot

on:
  schedule:
    # Channel 1: iταchι Live (Anime Viral Shorts)
    - cron: '30 7 * * *'    # 01:30 PM BST (07:30 UTC)
    - cron: '30 12 * * *'   # 06:30 PM BST (12:30 UTC)
    - cron: '30 15 * * *'   # 09:30 PM BST (15:30 UTC)
    # Channel 2: ArisVexx (Dark Psychology - USA High-CPM Peak)
    - cron: '00 16 * * *'   # 10:00 PM BST = 12:00 PM US EST Lunch (16:00 UTC)
    - cron: '30 19 * * *'   # 01:30 AM BST = 03:30 PM US EST Commute (19:30 UTC)
    - cron: '30 0 * * *'    # 06:30 AM BST = 08:30 PM US EST Bedtime (00:30 UTC)

  workflow_dispatch:
    inputs:
      target:
        description: 'Target to run (ch1 = Anime & Instagram | ch2 = ArisVexx | auto = By Time)'
        required: true
        default: 'ch1'
        type: choice
        options:
          - ch1
          - auto
          - ch2
          - both

permissions:
  contents: write

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-freefont-ttf fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Working Directories
        run: |
          mkdir -p data/approved_clips data/processed_shorts data/broll data/bgm data/temp data/logs uploaded not_uploaded

      - name: Prepare Environment File
        env:
          ENV_CONTENT: ${{ secrets.ENV_CONTENT }}
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
        run: |
          python -c "import os; c = os.environ.get('ENV_CONTENT', ''); open('.env', 'w', encoding='utf-8').write(c.strip() + '\nPIPELINE_MODE=auto\nFFMPEG_PATH=ffmpeg\n') if c else print('[!] WARNING: secrets.ENV_CONTENT is empty!')"
          python -c "import os; ig = os.environ.get('INSTAGRAM_SESSION_DATA', '').strip(); os.makedirs('config', exist_ok=True); open('config/instagram_session.json', 'w', encoding='utf-8').write(ig) if ig else None"
          python -c "import os; print('[+] .env file status: exists=' + str(os.path.exists('.env')) + ', size=' + str(os.path.getsize('.env') if os.path.exists('.env') else 0) + ' bytes')"
          python -c "import os; print('[+] Instagram session exists: ' + str(os.path.exists('config/instagram_session.json')))"

      - name: Run Cloud Video Engine & Publisher
        env:
          PYTHONUNBUFFERED: "1"
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python -u scripts/run_cloud_slot.py ${{ github.event.inputs.target || 'auto' }}

      - name: Sync Ledger and Logs to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ledger.json data/logs/
          git diff-index --quiet HEAD || (git commit -m "chore(autopilot): update ledger & logs [skip ci]" && git push)

      - name: Upload Published Videos for Mobile / Manual FB & TikTok Posting
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aris-published-videos-${{ github.run_number }}
          path: |
            uploaded/
            not_uploaded/
          retention-days: 14
